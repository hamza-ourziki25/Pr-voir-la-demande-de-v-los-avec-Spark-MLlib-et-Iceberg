[project]
name = "tp2x"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Hamza Ourziki", email = "hamza.ourziki25@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "chromadb>=1.5.9",
    "langchain-community>=0.4.2",
    "langchain-google-genai>=4.5.0",
    "langchain-ollama>=1.1.0",
    "langchain-text-splitters>=1.1.3",
    "pypdf>=7.1.0",
    "python-dotenv>=1.2.4",
    "streamlit>=1.67.0",
    "tiktoken>=0.14.0",
]

[project.scripts]
tp2x = "tp2x:main"

[build-system]
requires = ["uv_build>=0.13.7,<0.14.0"]
build-backend = "uv_build"
